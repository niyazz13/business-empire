<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-select=no">
    <title>Бизнес Империя Pro: Терминал 3D</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Задний план (Офис и город) -->
    <div class="office-background">
        <div class="clouds"></div>
        <div class="city-skyline"></div>
        <div class="interior"></div>
        <div class="sun-glare"></div>
    </div>

    <!-- Верхняя панель -->
    <div class="top-row">
        <div id="rankDisplay" class="rank-badge">💼 Стажер</div>
        <button id="dailyBtn" class="daily-btn">🎁 Бонус</button>
    </div>

    <!-- Главная рабочая область -->
    <div class="main-workspace">
        <div id="balanceDisplay" class="balance">$0</div>
        <div id="incomeDisplay" class="income-rate">Доход: $0/с</div>

        <!-- Клик-модуль сейфа -->
        <div class="coin-container">
            <div id="mainCoin" class="safe-3d">
                <div class="safe-wall"></div>
                <div class="safe-door safe-front">
                    <div class="safe-rivets"></div>
                    <div class="safe-hinge h-top"></div>
                    <div class="safe-hinge h-bottom"></div>
                    <div class="safe-wheel-center">
                        <div class="wheel-spoke spoke-1"></div>
                        <div class="wheel-spoke spoke-2"></div>
                        <div class="wheel-spoke spoke-3"></div>
                        <div class="wheel-rim"></div>
                    </div>
                </div>
                <div class="safe-door safe-back"></div>
            </div>
        </div>

        <!-- Биржевой график -->
        <div class="chart-box">
            <div class="chart-wrap">
                <div id="stockLabel" class="chart-label">Индекс биржи: $35.00</div>
                <canvas id="marketChart"></canvas>
            </div>
            <div class="trade-controls-wrapper">
                <div class="trade-controls">
                    <button id="buyStockBtn" class="trade-btn trade-buy">Купить 1</button>
                    <button id="buyStock10Btn" class="trade-btn trade-buy">Купить 10</button>
                    <button id="buyStockMaxBtn" class="trade-btn trade-buy">На все</button>
                    <button id="sellStockBtn" class="trade-btn trade-sell">Продать все</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Контейнер списков магазинов -->
    <div class="assets-holder glass-panel">
        <!-- 1. Коммерция -->
        <div id="businessContainer">
            <div id="shopList"></div>
        </div>
        
        <!-- 2. Капитал -->
        <div id="realEstateContainer" class="hidden">
            <div id="realEstateList"></div>
        </div>
        
        <!-- 3. Монеты -->
        <div id="cryptoContainer" class="hidden">
            <div id="cryptoList"></div>
        </div>
    </div>

    <!-- Нижняя панель навигации -->
    <div class="navigation-panel">
        <button id="navShopBtn" class="nav-btn active">💼 Коммерция</button>
        <button id="navRealEstateBtn" class="nav-btn">🏢 Капитал</button>
        <button id="navCryptoBtn" class="nav-btn">🪙 Монеты</button>
    </div>

    <!-- Подключение скрипта строго в конце body -->
    <script src="script.js"></script>
</body>
</html>
