<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Бизнес Империя Pro: Терминал 3D</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="office-background">
        <div class="clouds"></div>
        <div class="city-skyline"></div>
        <div class="interior"></div>
        <div class="sun-glare"></div>
    </div>
    
    <div class="header-panel">
        <div class="top-row">
            <div class="rank-badge" id="rankDisplay">💼 Стажер</div>
            <button class="daily-btn" id="dailyBtn">🎁 Бонус</button>
        </div>
        <div class="balance" id="balanceDisplay">$0</div>
        <div class="income-rate" id="incomeDisplay">Доход: $0/с</div>
        <div class="news-ticker" id="newsTicker"></div>
    </div>
    
    <div class="navigation-panel">
        <button class="nav-btn active" id="navShopBtn">💼 Коммерция</button>
        <button class="nav-btn" id="navRealEstateBtn">🏢 Капитал</button>
        <button class="nav-btn" id="navCryptoBtn">🪙 Монеты</button>
    </div>
    
    <div class="main-workspace">
        <div class="coin-container">
            <div class="safe-3d" id="mainCoin">
                <div class="safe-wall"></div>
                <div class="safe-door safe-front">
                    <div class="safe-rivets"></div>
                    <div class="safe-hinge h-top"></div>
                    <div class="safe-hinge h-bottom"></div>
                    <div class="safe-wheel-center">
                        <div class="wheel-spoke spoke-1"></div>
                        <div class="wheel-spoke spoke-2"></div>
                        <div class="wheel-spoke spoke-3"></div>
                        <div class="wheel-rim"></div>
                    </div>
                </div>
                <div class="safe-door safe-back"></div>
            </div>
        </div>
        
        <div class="chart-box glass-panel">
            <div class="chart-wrap">
                <span class="chart-label" id="stockLabel">Индекс биржи: $35.00</span>
                <canvas id="marketChart"></canvas>
            </div>
            <div class="trade-controls-wrapper">
                <div class="trade-controls">
                    <button class="trade-btn trade-buy" id="buyStockBtn">Купить 1</button>
                    <button class="trade-btn trade-buy" id="buyStock10Btn">Купить 10</button>
                    <button class="trade-btn trade-buy" id="buyStockMaxBtn">На все</button>
                </div>
                <button class="trade-btn trade-sell" id="sellStockBtn" style="width: 100%; margin-top: 4px;">Продать все</button>
            </div>
        </div>
    </div>
    
    <div class="assets-holder glass-panel" id="businessContainer">
        <div id="shopList"></div>
    </div>
    
    <div class="assets-holder glass-panel hidden" id="realEstateContainer">
        <div id="realEstateList"></div>
    </div>
    
    <div class="assets-holder glass-panel hidden" id="cryptoContainer">
        <div id="cryptoList"></div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
